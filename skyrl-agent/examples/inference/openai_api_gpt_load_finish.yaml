agent_cls: skyrl_agent.agents.react.ReActAgent

task: skyrl_agent.tasks.bfcl_eval_task.BFCLEvalTask

tools: []

data:
  data_source_key: data_source

generator:
  infer_backend: openai_api
  bfcl_tool_params_path: /home/ec2-user/shuo/SkyRL/skyrl-agent/skyrl_agent/tools/bfcl_tool_params.json
  backend_config:
    model_name: gpt-5-nano
    api_url: https://api.openai.com
  num_trajectories: 1
  max_iterations: 10  # parallel category needs up to 8 calls; +2 buffer
  max_prompt_length: 32768
  sampling_params:
    temperature: 1.0
    max_tokens: 8192
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 1.0
      max_tokens: 8192
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  early_step_threshold: 0
  enable_turn_reminder: false
  fold_tool_info: false  # set true in batch mode to collapse each task's history into a summary

dispatcher:
  type: async_batch
  scheduler: naive
  max_parallel_agents: 128
  max_eval_parallel_agents: 128
