agent_cls: skyrl_agent.agents.react.ReActAgent

task: skyrl_agent.tasks.general_react.utils.GeneralReactTask

tools: ["load", "finish"]

data:
  data_source_key: data_source

generator:
  infer_backend: openai_api
  backend_config:
    model_name: gpt-5-nano
    api_url: https://api.openai.com
  num_trajectories: 1
  max_iterations: 30
  max_prompt_length: 32768
  sampling_params:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  early_step_threshold: 7
  enable_turn_reminder: true

dispatcher:
  type: async_batch
  scheduler: naive
  max_parallel_agents: 1
  max_eval_parallel_agents: 1
